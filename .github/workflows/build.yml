name: Build StackDialer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unpack Archives & Detect Project Root
        run: |
          echo "=== 1. Checking Repository Contents ==="
          ls -la

          echo "=== 2. Unpacking any ZIP files found ==="
          find . -maxdepth 2 -name "*.zip" -exec unzip -o -q {} \; || true

          echo "=== 3. Searching for pubspec.yaml ==="
          PUBSPEC=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found!"
            echo "Directory tree:"
            find . -maxdepth 3
            exit 1
          fi

          TARGET_DIR=$(dirname "$PUBSPEC")
          echo "SUCCESS: Found pubspec.yaml in: $TARGET_DIR"
          echo "FLUTTER_PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

          # Auto-patch build.gradle if needed
          if [ -f "$TARGET_DIR/android/app/build.gradle" ]; then
            sed -i 's/compileSdk 35/compileSdk 36/g' "$TARGET_DIR/android/app/build.gradle" || true
            sed -i 's/targetSdkVersion 35/targetSdkVersion 36/g' "$TARGET_DIR/android/app/build.gradle" || true
          fi

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd "${{ env.FLUTTER_PROJECT_DIR }}"
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd "${{ env.FLUTTER_PROJECT_DIR }}"
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StackDialer-Release-APK
          path: |
            **/build/app/outputs/flutter-apk/app-release.apk
            **/build/app/outputs/apk/release/*.apk
          if-no-files-found: error
