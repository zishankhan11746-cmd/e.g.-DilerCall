
name: Build StackDialer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unpack Archives & Detect Project Root
        shell: bash
        run: |
          echo "=== 1. Checking Repository Contents ==="
          ls -la

          echo "=== 2. Unpacking ZIP Archives ==="
          find . -maxdepth 2 -type f -name "*.zip" -exec unzip -o -q {} \; || true

          echo "=== 3. Searching for pubspec.yaml ==="
          PUBSPEC=$(find . -name "pubspec.yaml" -not -path "*/.*" -type f | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found!"
            echo "Directory tree:"
            find . -maxdepth 4 -type f | head -n 200
            exit 1
          fi

          TARGET_DIR=$(dirname "$PUBSPEC")
          echo "SUCCESS: Found Flutter project in: $TARGET_DIR"
          echo "FLUTTER_PROJECT_DIR=$TARGET_DIR" >> "$GITHUB_ENV"

          echo "=== 4. Checking Android Gradle Files ==="
          if [ -f "$TARGET_DIR/android/app/build.gradle" ]; then
            sed -i 's/compileSdk 35/compileSdk 36/g' "$TARGET_DIR/android/app/build.gradle" || true
            sed -i 's/targetSdkVersion 35/targetSdkVersion 36/g' "$TARGET_DIR/android/app/build.gradle" || true
          elif [ -f "$TARGET_DIR/android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = 35/compileSdk = 36/g' "$TARGET_DIR/android/app/build.gradle.kts" || true
          fi

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Java and Flutter Versions
        run: |
          java -version
          flutter --version
          flutter doctor -v

      - name: Install Dependencies
        run: |
          cd "${{ env.FLUTTER_PROJECT_DIR }}"
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd "${{ env.FLUTTER_PROJECT_DIR }}"
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Check APK File
        run: |
          echo "=== Searching for APK ==="
          find "${{ env.FLUTTER_PROJECT_DIR }}/build" -name "*.apk" -type f

          APK="${{ env.FLUTTER_PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi

          echo "SUCCESS: APK generated!"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StackDialer-Release-APK
          path: |
            **/build/app/outputs/flutter-apk/app-release.apk
            **/build/app/outputs/apk/release/*.apk
          if-no-files-found: error
