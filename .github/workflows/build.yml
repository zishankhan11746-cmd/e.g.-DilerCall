name: Build StackDialer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Workspace & Detect Flutter Directory
        run: |
          echo "Checking directory structure..."
          if [ -f "pubspec.yaml" ]; then
            TARGET_DIR="."
          elif [ -f "flutter_app/pubspec.yaml" ]; then
            TARGET_DIR="flutter_app"
          else
            PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
            if [ -n "$PUBSPEC_PATH" ]; then
              TARGET_DIR=$(dirname "$PUBSPEC_PATH")
            else
              TARGET_DIR="."
            fi
          fi
          echo "Detected project directory: $TARGET_DIR"
          echo "FLUTTER_PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd ${{ env.FLUTTER_PROJECT_DIR }}
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd ${{ env.FLUTTER_PROJECT_DIR }}
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Locate & Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StackDialer-Release-APK
          path: |
            **/build/app/outputs/flutter-apk/app-release.apk
            **/build/app/outputs/apk/release/*.apk
          if-no-files-found: error
